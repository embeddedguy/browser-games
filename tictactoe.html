<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #1a1a2e;
      font-family: 'Segoe UI', sans-serif;
      color: #eee;
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #e94560;
    }

    #status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 1.8rem;
      color: #a8dadc;
      font-weight: 600;
      letter-spacing: 1px;
    }

    #board {
      display: grid;
      grid-template-columns: repeat(3, 110px);
      grid-template-rows: repeat(3, 110px);
      gap: 10px;
    }

    .cell {
      background: #16213e;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s, transform 0.1s;
      user-select: none;
    }

    .cell:hover:not(.taken) {
      background: #0f3460;
      transform: scale(1.05);
    }

    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }

    .cell.win {
      background: #0f3460;
      animation: pulse 0.5s ease;
    }

    @keyframes pulse {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.12); }
      100% { transform: scale(1); }
    }

    #scores {
      display: flex;
      gap: 2rem;
      margin-top: 1.8rem;
      font-size: 1rem;
      color: #888;
    }

    #scores span { text-align: center; }
    #scores strong { display: block; font-size: 1.8rem; color: #eee; }
    .score-x strong { color: #e94560; }
    .score-o strong { color: #a8dadc; }
    .score-tie strong { color: #f0a500; }

    #reset {
      margin-top: 1.8rem;
      padding: 0.6rem 2rem;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 1px;
      background: #e94560;
      color: #fff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    #reset:hover { background: #c73652; transform: scale(1.04); }

    #mode-toggle {
      margin-top: 0.8rem;
      padding: 0.5rem 1.6rem;
      font-size: 0.9rem;
      font-weight: 600;
      letter-spacing: 1px;
      background: #0f3460;
      color: #a8dadc;
      border: 2px solid #a8dadc;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
    }

    #mode-toggle:hover { background: #16213e; }
  </style>
</head>
<body>

<h1>Tic Tac Toe</h1>
<div id="status">X's turn</div>

<div id="board">
  <div class="cell" data-i="0"></div>
  <div class="cell" data-i="1"></div>
  <div class="cell" data-i="2"></div>
  <div class="cell" data-i="3"></div>
  <div class="cell" data-i="4"></div>
  <div class="cell" data-i="5"></div>
  <div class="cell" data-i="6"></div>
  <div class="cell" data-i="7"></div>
  <div class="cell" data-i="8"></div>
</div>

<div id="scores">
  <span class="score-x"><strong id="score-x">0</strong>X Wins</span>
  <span class="score-tie"><strong id="score-tie">0</strong>Ties</span>
  <span class="score-o"><strong id="score-o">0</strong>O Wins</span>
</div>

<button id="reset">New Game</button>
<button id="mode-toggle">vs Computer: OFF</button>

<script>
  const cells = document.querySelectorAll('.cell');
  const status = document.getElementById('status');
  const resetBtn = document.getElementById('reset');
  const modeBtn = document.getElementById('mode-toggle');

  const scores = { X: 0, O: 0, tie: 0 };
  let board = Array(9).fill('');
  let current = 'X';
  let gameOver = false;
  let vsComputer = false;

  const WINS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  function checkWinner(b) {
    for (const [a, c, d] of WINS) {
      if (b[a] && b[a] === b[c] && b[a] === b[d]) return { winner: b[a], line: [a, c, d] };
    }
    if (b.every(v => v)) return { winner: 'tie' };
    return null;
  }

  function minimax(b, isMax) {
    const result = checkWinner(b);
    if (result) {
      if (result.winner === 'O') return 10;
      if (result.winner === 'X') return -10;
      return 0;
    }
    const scores = [];
    b.forEach((v, i) => {
      if (!v) {
        b[i] = isMax ? 'O' : 'X';
        scores.push(minimax(b, !isMax));
        b[i] = '';
      }
    });
    return isMax ? Math.max(...scores) : Math.min(...scores);
  }

  function bestMove(b) {
    let best = -Infinity, move = -1;
    b.forEach((v, i) => {
      if (!v) {
        b[i] = 'O';
        const s = minimax(b, false);
        b[i] = '';
        if (s > best) { best = s; move = i; }
      }
    });
    return move;
  }

  function handleClick(i) {
    if (gameOver || board[i]) return;
    play(i);
    if (!gameOver && vsComputer && current === 'O') {
      setTimeout(() => play(bestMove(board)), 300);
    }
  }

  function play(i) {
    board[i] = current;
    cells[i].textContent = current;
    cells[i].classList.add(current.toLowerCase(), 'taken');

    const result = checkWinner(board);
    if (result) {
      gameOver = true;
      if (result.winner === 'tie') {
        status.textContent = "It's a tie!";
        scores.tie++;
        document.getElementById('score-tie').textContent = scores.tie;
      } else {
        status.textContent = `${result.winner} wins!`;
        result.line.forEach(idx => cells[idx].classList.add('win'));
        scores[result.winner]++;
        document.getElementById(`score-${result.winner.toLowerCase()}`).textContent = scores[result.winner];
      }
    } else {
      current = current === 'X' ? 'O' : 'X';
      status.textContent = `${current}'s turn${vsComputer && current === 'O' ? ' (thinking...)' : ''}`;
    }
  }

  cells.forEach(cell => cell.addEventListener('click', () => handleClick(+cell.dataset.i)));

  resetBtn.addEventListener('click', () => {
    board = Array(9).fill('');
    current = 'X';
    gameOver = false;
    cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
    status.textContent = "X's turn";
  });

  modeBtn.addEventListener('click', () => {
    vsComputer = !vsComputer;
    modeBtn.textContent = `vs Computer: ${vsComputer ? 'ON' : 'OFF'}`;
    resetBtn.click();
  });
</script>
</body>
</html>
