<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#FF6B35">
  <meta name="description" content="Guided progressive overload strength training tracker">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="WorkoutTracker">

  <title>WorkoutTracker</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <link rel="stylesheet" href="/src/css/main.css">

  <!--
    Import map: resolves bare specifiers to CDN URLs in the browser.
    Node (Vitest) uses the npm packages in node_modules instead.
    Keep version pins in sync with package.json devDependencies.
  -->
  <script type="importmap">
  {
    "imports": {
      "dexie":               "https://cdn.jsdelivr.net/npm/dexie@4.0.8/dist/dexie.mjs",
      "firebase/app":        "https://www.gstatic.com/firebasejs/10.14.0/firebase-app.js",
      "firebase/auth":       "https://www.gstatic.com/firebasejs/10.14.0/firebase-auth.js",
      "firebase/firestore":  "https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore.js"
    }
  }
  </script>

  <!-- Chart.js for progress charts -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
</head>
<body>
  <!-- App shell: all views render into this element -->
  <div id="app">
    <!-- Loading state shown until JS boots -->
    <div style="display:flex;align-items:center;justify-content:center;min-height:100dvh;color:#FF6B35;font-size:1.5rem;font-weight:700;">
      WorkoutTracker
    </div>
  </div>

  <!-- Register service worker -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js')
        .catch(err => console.warn('SW registration failed:', err));
    }
  </script>

  <!-- Boot the app -->
  <script type="module" src="/src/js/app.js"></script>
</body>
</html>
